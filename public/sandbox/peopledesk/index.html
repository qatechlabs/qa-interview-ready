<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeopleDesk HR</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f6fb;color:#2b2b3a}
  button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid #6b4ce6;background:#6b4ce6;color:#fff;padding:8px 18px;font-weight:600}
  button.ghost{background:#fff;color:#6b4ce6}
  button.danger{background:#e5484d;border-color:#e5484d}
  button.icon{border-radius:8px;padding:4px 10px;background:#fff;color:#6b4ce6}
  input,select,textarea{font:inherit;padding:9px 10px;border:1px solid #d4d4e2;border-radius:8px;width:100%;background:#fff;color:inherit}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:#5d5d72;margin-bottom:4px}
  .field .req{color:#e5484d;font-size:12px;margin-top:4px}
  .field.has-error input,.field.has-error select{border-color:#e5484d}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#ede9ff,#f6f6fb)}
  .login{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(60,40,140,.12)}
  .login h1{margin:0 0 4px;color:#6b4ce6;text-align:center}
  .login p.sub{margin:0 0 18px;text-align:center;color:#5d5d72;font-size:14px}
  .alert{background:#fff0f0;color:#b42318;border:1px solid #fecdca;border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .demo{font-size:13px;background:#f6f6fb;border-radius:8px;padding:8px 10px;margin-bottom:14px;color:#5d5d72}
  .shell{display:flex;min-height:100vh}
  aside{width:200px;background:#fff;border-right:1px solid #e6e6f0;padding:16px 10px;flex-shrink:0}
  aside .logo{font-weight:800;color:#6b4ce6;margin:0 8px 16px}
  aside a{display:block;padding:9px 12px;border-radius:8px;color:#2b2b3a;text-decoration:none;cursor:pointer}
  aside a.active{background:#ede9ff;color:#6b4ce6;font-weight:600}
  .content{flex:1;min-width:0}
  .topbar{background:#fff;border-bottom:1px solid #e6e6f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar h1{font-size:18px;margin:0}
  .user-dropdown{position:relative}
  .dropdown-menu{position:absolute;right:0;top:40px;background:#fff;border:1px solid #e6e6f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);min-width:140px;z-index:5}
  .dropdown-menu a{display:block;padding:10px 14px;cursor:pointer}
  .page{padding:18px}
  .card{background:#fff;border:1px solid #e6e6f0;border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 12px}
  .widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .widget .num{font-size:28px;font-weight:800;color:#6b4ce6}
  .filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-items:end}
  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid #eeeef5}
  .table th{color:#5d5d72;font-weight:600;background:#fafaff}
  .records{font-size:14px;color:#5d5d72;margin:4px 0 10px}
  .toast{position:fixed;right:16px;bottom:16px;background:#12b76a;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:10}
  .toast .toast-title{font-weight:700}
  .modal-back{position:fixed;inset:0;background:rgba(20,20,40,.45);display:grid;place-items:center;z-index:9}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:360px;width:calc(100% - 32px);text-align:center}
  .row-actions{display:flex;gap:6px}
  .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#fff4e5;color:#b54708}
  .actions{display:flex;gap:10px;justify-content:flex-end}
  @media (max-width:640px){aside{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";
  var NS = "lab:peopledesk:";
  var SEED = [
    { id: "0001", first: "Priya", middle: "", last: "Sharma", job: "QA Engineer", status: "Full-Time Permanent", sub: "Quality Engineering" },
    { id: "0002", first: "Rahul", middle: "K", last: "Verma", job: "SDET", status: "Full-Time Permanent", sub: "Quality Engineering" },
    { id: "0003", first: "Ananya", middle: "", last: "Iyer", job: "Product Manager", status: "Full-Time Contract", sub: "Product" },
    { id: "0004", first: "Vikram", middle: "", last: "Singh", job: "DevOps Engineer", status: "Full-Time Permanent", sub: "Platform" },
    { id: "0005", first: "Sneha", middle: "R", last: "Patel", job: "HR Executive", status: "Part-Time", sub: "Human Resources" },
    { id: "0006", first: "Arjun", middle: "", last: "Nair", job: "Test Lead", status: "Full-Time Permanent", sub: "Quality Engineering" }
  ];
  var LEAVE_TYPES = ["Casual Leave", "Sick Leave", "Earned Leave"];

  function get(k, d) { try { var v = sessionStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function set(k, v) { try { sessionStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
  function del(k) { try { sessionStorage.removeItem(NS + k); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function employees() { return get("employees", SEED); }
  function leaves() { return get("leaves", []); }
  function loggedIn() { return get("auth", false); }
  function route() { return location.hash.replace(/^#/, "") || "/auth/login"; }
  function go(p) { location.hash = p; }

  var ui = { loginError: "", loginRequired: {}, menu: false, toast: null, confirmId: null, search: { name: "", id: "" }, addErrors: {}, leaveErrors: {} };
  var app = document.getElementById("app");
  var toastTimer;

  window.__lab = {
    get employees() { return employees(); },
    get leaves() { return leaves(); },
    get loggedIn() { return loggedIn(); },
    reset: function () { Object.keys(sessionStorage).forEach(function (k) { if (k.indexOf(NS) === 0) sessionStorage.removeItem(k); }); }
  };

  function toast(title, text) {
    ui.toast = { title: title, text: text };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; render(); }, 3000);
  }

  function loginView() {
    var r = ui.loginRequired;
    return '<div class="login-wrap"><div class="login"><h1>PeopleDesk</h1><p class="sub">Sign in to your HR workspace</p>' +
      '<div class="demo">Demo login: <b>Admin</b> / <b>admin123</b></div>' +
      (ui.loginError ? '<div class="alert" role="alert"><p class="alert-content-text" style="margin:0">' + esc(ui.loginError) + '</p></div>' : '') +
      '<form id="login-form" novalidate>' +
      '<div class="field' + (r.username ? " has-error" : "") + '"><label for="username">Username</label><input id="username" name="username" placeholder="Username" autocomplete="off">' + (r.username ? '<div class="req">Required</div>' : '') + '</div>' +
      '<div class="field' + (r.password ? " has-error" : "") + '"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Password">' + (r.password ? '<div class="req">Required</div>' : '') + '</div>' +
      '<button type="submit" style="width:100%">Login</button></form></div></div>';
  }

  function shell(active, title, body) {
    var links = [["dashboard", "Dashboard", "/dashboard"], ["pim", "PIM", "/pim/employees"], ["leave", "Leave", "/leave/apply"]];
    return '<div class="shell"><aside><div class="logo">PeopleDesk</div><nav aria-label="Sidebar">' +
      links.map(function (l) { return '<a role="link" tabindex="0" data-go="' + l[2] + '"' + (active === l[0] ? ' class="active" aria-current="page"' : '') + '>' + l[1] + '</a>'; }).join("") +
      '</nav></aside><div class="content"><div class="topbar"><h1>' + esc(title) + '</h1>' +
      '<div class="user-dropdown"><button class="ghost" data-action="menu" aria-label="User menu">Admin ▾</button>' +
      (ui.menu ? '<div class="dropdown-menu" role="menu"><a role="menuitem" data-action="logout">Logout</a></div>' : '') +
      '</div></div><div class="page">' + body + '</div></div></div>' +
      (ui.toast ? '<div class="toast" role="status"><div class="toast-title">' + esc(ui.toast.title) + '</div><div class="toast-message">' + esc(ui.toast.text) + '</div></div>' : '') +
      (ui.confirmId ? '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title" style="margin-top:0">Are you sure?</h2>' +
        '<p>The selected record will be permanently deleted. Are you sure you want to continue?</p>' +
        '<div class="actions" style="justify-content:center"><button class="ghost" data-action="cancel-delete">No, Cancel</button><button class="danger" data-action="confirm-delete">Yes, Delete</button></div></div></div>' : '');
  }

  function dashboardView() {
    var e = employees();
    var pending = leaves().filter(function (l) { return l.status === "Pending Approval"; }).length;
    return shell("dashboard", "Dashboard",
      '<div class="widgets">' +
      '<div class="card widget" data-test="widget-employees"><div>Total employees</div><div class="num">' + e.length + '</div></div>' +
      '<div class="card widget" data-test="widget-leaves"><div>Leave requests pending</div><div class="num">' + pending + '</div></div>' +
      '<div class="card widget"><div>Time at work</div><div class="num">8h 12m</div></div>' +
      '</div><div class="card"><h2>Quick launch</h2><div class="actions" style="justify-content:flex-start"><button data-go="/pim/add">Add Employee</button><button class="ghost" data-go="/leave/apply">Apply Leave</button></div></div>');
  }

  function fullName(e) { return [e.first, e.middle, e.last].filter(Boolean).join(" "); }

  function employeeListView() {
    var s = get("search", { name: "", id: "" });
    var list = employees().filter(function (e) {
      return (!s.name || fullName(e).toLowerCase().indexOf(s.name.toLowerCase()) >= 0) && (!s.id || e.id === s.id);
    });
    var rows = list.map(function (e) {
      return '<tr data-test="employee-row"><td>' + esc(e.id) + '</td><td>' + esc(e.first + (e.middle ? " " + e.middle : "")) + '</td><td>' + esc(e.last) + '</td><td>' + esc(e.job) + '</td><td>' + esc(e.status) + '</td>' +
        '<td><div class="row-actions"><button class="icon" data-edit="' + esc(e.id) + '" aria-label="Edit ' + esc(fullName(e)) + '">Edit</button>' +
        '<button class="icon" data-delete="' + esc(e.id) + '" aria-label="Delete ' + esc(fullName(e)) + '">Delete</button></div></td></tr>';
    }).join("");
    return shell("pim", "PIM",
      '<div class="card"><h2>Employee Information</h2><form id="search-form" class="filters" novalidate>' +
      '<div class="field" style="margin:0"><label for="search-name">Employee Name</label><input id="search-name" placeholder="Type for hints..." value="' + esc(s.name) + '"></div>' +
      '<div class="field" style="margin:0"><label for="search-id">Employee Id</label><input id="search-id" value="' + esc(s.id) + '"></div>' +
      '<div class="actions"><button type="button" class="ghost" data-action="reset-search">Reset</button><button type="submit">Search</button></div></form></div>' +
      '<div class="card"><div class="actions" style="justify-content:space-between;align-items:center"><span class="records" data-test="records-found">' +
      (list.length ? "(" + list.length + ") Record" + (list.length === 1 ? "" : "s") + " Found" : "No Records Found") +
      '</span><button data-go="/pim/add">+ Add</button></div>' +
      '<div style="overflow-x:auto"><table class="table" aria-label="Employee list"><thead><tr><th>Id</th><th>First (&amp; Middle) Name</th><th>Last Name</th><th>Job Title</th><th>Employment Status</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>');
  }

  function nextId() {
    var max = employees().reduce(function (m, e) { return Math.max(m, parseInt(e.id, 10) || 0); }, 0);
    return String(max + 1).padStart(4, "0");
  }

  function addEmployeeView() {
    var er = ui.addErrors;
    return shell("pim", "PIM",
      '<div class="card"><h2>Add Employee</h2><form id="add-form" novalidate>' +
      '<div class="filters">' +
      '<div class="field' + (er.first ? " has-error" : "") + '"><label for="firstName">First Name</label><input id="firstName" name="firstName" placeholder="First Name">' + (er.first ? '<div class="req">Required</div>' : '') + '</div>' +
      '<div class="field"><label for="middleName">Middle Name</label><input id="middleName" name="middleName" placeholder="Middle Name"></div>' +
      '<div class="field' + (er.last ? " has-error" : "") + '"><label for="lastName">Last Name</label><input id="lastName" name="lastName" placeholder="Last Name">' + (er.last ? '<div class="req">Required</div>' : '') + '</div>' +
      '<div class="field' + (er.id ? " has-error" : "") + '"><label for="employeeId">Employee Id</label><input id="employeeId" name="employeeId" value="' + nextId() + '">' + (er.id ? '<div class="req">' + esc(er.id) + '</div>' : '') + '</div>' +
      '<div class="field"><label for="jobTitle">Job Title</label><select id="jobTitle"><option value="">-- Select --</option><option>QA Engineer</option><option>SDET</option><option>Test Lead</option><option>Developer</option></select></div>' +
      '</div><div class="actions"><button type="button" class="ghost" data-go="/pim/employees">Cancel</button><button type="submit">Save</button></div></form></div>');
  }

  function detailsView(id) {
    var e = employees().filter(function (x) { return x.id === id; })[0];
    if (!e) return shell("pim", "PIM", '<div class="card">Employee not found.</div>');
    return shell("pim", "PIM", '<div class="card"><h2 data-test="employee-name">' + esc(fullName(e)) + '</h2>' +
      '<p>Employee Id: <b data-test="employee-id">' + esc(e.id) + '</b></p><p>Job Title: ' + esc(e.job || "-") + '</p>' +
      '<div class="actions" style="justify-content:flex-start"><button data-go="/pim/employees">Back to Employee List</button></div></div>');
  }

  function leaveView() {
    var er = ui.leaveErrors;
    var mine = leaves();
    var rows = mine.map(function (l, i) {
      return '<tr data-test="leave-row"><td>' + esc(l.from) + ' to ' + esc(l.to) + '</td><td>' + esc(l.type) + '</td><td>' + l.days + '</td><td><span class="badge" data-test="leave-status">' + esc(l.status) + '</span></td><td>' + esc(l.comment) + '</td>' +
        '<td>' + (l.status === "Pending Approval" ? '<button class="icon" data-cancel-leave="' + i + '">Cancel</button>' : '') + '</td></tr>';
    }).join("");
    return shell("leave", "Leave",
      '<div class="card"><h2>Apply Leave</h2><form id="leave-form" novalidate><div class="filters">' +
      '<div class="field' + (er.type ? " has-error" : "") + '"><label for="leaveType">Leave Type</label><select id="leaveType"><option value="">-- Select --</option>' +
      LEAVE_TYPES.map(function (t) { return "<option>" + t + "</option>"; }).join("") + '</select>' + (er.type ? '<div class="req">Required</div>' : '') + '</div>' +
      '<div class="field' + (er.from ? " has-error" : "") + '"><label for="fromDate">From Date</label><input id="fromDate" type="date">' + (er.from ? '<div class="req">' + esc(er.from) + '</div>' : '') + '</div>' +
      '<div class="field' + (er.to ? " has-error" : "") + '"><label for="toDate">To Date</label><input id="toDate" type="date">' + (er.to ? '<div class="req">' + esc(er.to) + '</div>' : '') + '</div>' +
      '</div><div class="field"><label for="comment">Comments</label><textarea id="comment" rows="2"></textarea></div>' +
      '<div class="actions"><button type="submit">Apply</button></div></form></div>' +
      '<div class="card"><h2>My Leave List</h2><span class="records" data-test="leave-records">' + (mine.length ? "(" + mine.length + ") Record" + (mine.length === 1 ? "" : "s") + " Found" : "No Records Found") + '</span>' +
      '<div style="overflow-x:auto"><table class="table" aria-label="My leave list"><thead><tr><th>Date</th><th>Leave Type</th><th>Days</th><th>Status</th><th>Comments</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>');
  }

  function render() {
    var r = route();
    if (!location.hash.replace(/^#\/?/, "")) { location.replace("#/auth/login"); return; }
    if (r !== "/auth/login" && !loggedIn()) { location.replace("#/auth/login"); return; }
    var html;
    if (r === "/auth/login") html = loginView();
    else if (r === "/dashboard") html = dashboardView();
    else if (r === "/pim/employees") html = employeeListView();
    else if (r === "/pim/add") html = addEmployeeView();
    else if (r.indexOf("/pim/employee/") === 0) html = detailsView(r.slice(14));
    else if (r === "/leave/apply") html = leaveView();
    else html = shell("", "Not found", '<div class="card">Page not found.</div>');
    app.innerHTML = html;
    document.title = "PeopleDesk HR";
  }

  function rerenderKeep(ids) {
    var vals = {};
    ids.forEach(function (id) { var el = document.getElementById(id); if (el) vals[id] = el.value; });
    render();
    ids.forEach(function (id) { var el = document.getElementById(id); if (el && vals[id] != null) el.value = vals[id]; });
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-action],[data-delete],[data-edit],[data-cancel-leave]");
    if (!t) { if (ui.menu) { ui.menu = false; render(); } return; }
    if (t.dataset.action === "menu") { ui.menu = !ui.menu; return render(); }
    ui.menu = false;
    if (t.dataset.go) { ui.addErrors = {}; ui.leaveErrors = {}; if (route() === t.dataset.go) return render(); return go(t.dataset.go); }
    if (t.dataset.edit) return go("/pim/employee/" + t.dataset.edit);
    if (t.dataset.delete) { ui.confirmId = t.dataset.delete; return render(); }
    if (t.dataset.action === "cancel-delete") { ui.confirmId = null; return render(); }
    if (t.dataset.action === "confirm-delete") {
      var id = ui.confirmId; ui.confirmId = null;
      set("employees", employees().filter(function (x) { return x.id !== id; }));
      toast("Success", "Successfully Deleted");
      return render();
    }
    if (t.dataset.cancelLeave != null) {
      var ls = leaves(); ls[+t.dataset.cancelLeave].status = "Cancelled"; set("leaves", ls);
      toast("Success", "Successfully Updated");
      return render();
    }
    if (t.dataset.action === "reset-search") { del("search"); return render(); }
    if (t.dataset.action === "logout") { del("auth"); return go("/auth/login"); }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "login-form") {
      var u = document.getElementById("username").value, p = document.getElementById("password").value;
      ui.loginRequired = { username: !u.trim(), password: !p };
      ui.loginError = "";
      if (u.trim() && p) {
        if (u.trim() === "Admin" && p === "admin123") { set("auth", true); ui.loginRequired = {}; return go("/dashboard"); }
        ui.loginError = "Invalid credentials";
      }
      return rerenderKeep(["username"]);
    }
    if (f.id === "search-form") {
      set("search", { name: document.getElementById("search-name").value.trim(), id: document.getElementById("search-id").value.trim() });
      return render();
    }
    if (f.id === "add-form") {
      var first = document.getElementById("firstName").value.trim(), middle = document.getElementById("middleName").value.trim();
      var last = document.getElementById("lastName").value.trim(), id = document.getElementById("employeeId").value.trim();
      var job = document.getElementById("jobTitle").value;
      ui.addErrors = { first: !first, last: !last, id: !id ? "Required" : (employees().some(function (x) { return x.id === id; }) ? "Employee Id already exists" : "") };
      if (ui.addErrors.first || ui.addErrors.last || ui.addErrors.id) return rerenderKeep(["firstName", "middleName", "lastName", "employeeId", "jobTitle"]);
      var list = employees(); list.push({ id: id, first: first, middle: middle, last: last, job: job, status: "Full-Time Probation", sub: "" });
      set("employees", list); ui.addErrors = {};
      toast("Success", "Successfully Saved");
      return go("/pim/employee/" + id);
    }
    if (f.id === "leave-form") {
      var type = document.getElementById("leaveType").value, from = document.getElementById("fromDate").value, to = document.getElementById("toDate").value;
      var comment = document.getElementById("comment").value.trim();
      ui.leaveErrors = { type: !type, from: !from ? "Required" : "", to: !to ? "Required" : (from && to < from ? "To date should be after from date" : "") };
      if (ui.leaveErrors.type || ui.leaveErrors.from || ui.leaveErrors.to) return rerenderKeep(["leaveType", "fromDate", "toDate", "comment"]);
      var days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
      var ls = leaves(); ls.push({ type: type, from: from, to: to, days: days, comment: comment, status: "Pending Approval" }); set("leaves", ls);
      ui.leaveErrors = {};
      toast("Success", "Successfully Submitted");
      return render();
    }
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
